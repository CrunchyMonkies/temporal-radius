apiVersion: v1
kind: Namespace
metadata:
  name: radius-coa-test
  labels:
    # istio-init (no Istio CNI on this cluster) needs NET_ADMIN/NET_RAW, which "restricted"
    # rejects; matches the other Temporal-client namespaces (temporal, fitpro).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
