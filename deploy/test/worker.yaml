apiVersion: apps/v1
kind: Deployment
metadata:
  name: radius-coa-worker
  labels: { app: radius-coa-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: radius-coa-worker }
  template:
    metadata:
      labels:
        app: radius-coa-worker
        # prod-frontend enforces STRICT Istio mTLS, so the worker needs a sidecar.
        sidecar.istio.io/inject: "true"
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: radius-coa-worker
          args: ["worker"]
          env:
            - { name: TEMPORAL_ADDRESS, value: "prod-frontend.temporal.svc:7233" }
            - { name: TEMPORAL_NAMESPACE, value: "radius-coa" }
            - { name: TEMPORAL_TASK_QUEUE, value: "radius-coa" }
            - name: RADIUS_SECRET
              valueFrom: { secretKeyRef: { name: radius-coa, key: RADIUS_SECRET } }
            - { name: RADIUS_TIMEOUT_MS, value: "2000" }
            - { name: RADIUS_RETRIES, value: "2" }
            - { name: RUST_LOG, value: "info" }
          ports:
            - { name: health, containerPort: 8080, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
