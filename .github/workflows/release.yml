name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build static binaries (x86_64 + aarch64 musl)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Collect binaries
        run: |
          mkdir -p release
          cp dist/linux_amd64/radius-coa-worker release/radius-coa-worker-x86_64-linux-musl
          cp dist/linux_arm64/radius-coa-worker release/radius-coa-worker-aarch64-linux-musl
          cp types/radius-coa.d.ts release/
          (cd release && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
